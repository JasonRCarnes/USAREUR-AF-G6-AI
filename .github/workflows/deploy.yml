
name: Deploy G6 AI Portal

on:
  push:
    branches:
      - main
    paths:
      - 'G6-AI-ASSISTANT/public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: G6-AI-ASSISTANT/public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
