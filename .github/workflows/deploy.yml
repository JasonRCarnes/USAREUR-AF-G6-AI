
name: Deploy G6 AI Portal

on:
  push:
    branches:
      - main
    paths:
      - 'G6-AI-ASSISTANT/public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # DIAGNOSTIC STEP
      - name: Check website files
        run: |
          echo "================================"
          echo "G6 AI PORTAL DEPLOYMENT CHECK"
          echo "================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "G6-AI-ASSISTANT directory:"
          ls -la G6-AI-ASSISTANT || true

          echo ""
          echo "Website public directory:"
          ls -la G6-AI-ASSISTANT/public || true

          echo ""
          echo "Checking index.html:"

          if [ -f "G6-AI-ASSISTANT/public/index.html" ]; then
            echo "SUCCESS: index.html exists."
          else
            echo "ERROR: index.html is missing."
            exit 1
          fi

      # UPLOAD WEBSITE
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: G6-AI-ASSISTANT/public

      # DEPLOY WEBSITE
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
