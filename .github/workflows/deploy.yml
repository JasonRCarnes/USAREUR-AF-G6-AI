name: Deploy G6 AI Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # DIAGNOSTIC STEP & SAFE AUTO-STAGE
      - name: Check website files
        run: |
          echo "================================"
          echo "G6 AI PORTAL DEPLOYMENT CHECK"
          echo "================================"
          echo "Current directory: $(pwd)"
          echo ""

          # Locate index.html anywhere in the repository
          HTML_PATH=$(find . -not -path "*/.*" -name "index.html" | head -n 1)

          if [ -n "$HTML_PATH" ]; then
            echo "SUCCESS: Found index.html at $HTML_PATH"
            # Get the exact folder where index.html resides
            SRC_DIR=$(dirname "$HTML_PATH")
            echo "Source assets will be copied from: $SRC_DIR"
            
            # Create a clean staging directory in /tmp
            rm -rf /tmp/_site
            mkdir -p /tmp/_site
            
            # Copy ONLY the contents of the directory, not the directory itself
            # This places index.html exactly at the root of the staging folder
            cp -RL "$SRC_DIR"/* /tmp/_site/
            
            # Safety cleaning of temporary files
            rm -rf /tmp/_site/_site
            
            # Move the clean, flattened site to the workspace
            rm -rf _site
            mv /tmp/_site _site
            
            echo ""
            echo "Staged files ready for upload (index.html MUST be listed here):"
            ls -la _site
          else
            echo "ERROR: index.html is missing from the repository."
            exit 1
          fi

      # UPLOAD WEBSITE
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # DEPLOY WEBSITE
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
