name: Deploy G6 AI Portal

on:
  push:
    branches:
      - main
    # Removed path restrictions to ensure any file update triggers the deployment run safely
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # DIAGNOSTIC STEP & AUTO-STAGE
      - name: Check website files
        run: |
          echo "================================"
          echo "G6 AI PORTAL DEPLOYMENT CHECK"
          echo "================================"
          echo "Current directory: $(pwd)"
          echo ""
          echo "Repository file structure:"
          find . -maxdepth 3 -not -path '*/.*'
          echo ""

          # Search for index.html while avoiding system directories
          HTML_PATH=$(find . -not -path "*/.*" -not -path "./_site*" -name "index.html" | head -n 1)

          if [ -n "$HTML_PATH" ]; then
            echo "SUCCESS: index.html found at $HTML_PATH"
            # Extract folder location of index.html
            SITE_DIR=$(dirname "$HTML_PATH")
            echo "Staging files from '$SITE_DIR' into staging directory '_site'..."
            mkdir -p _site
            cp -r "$SITE_DIR"/* _site/
          else
            echo "ERROR: index.html is missing from the repository."
            exit 1
          fi

      # UPLOAD WEBSITE
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploading the dynamically detected and staged folder
          path: _site

      # DEPLOY WEBSITE
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
