name: Deploy G6 AI Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # DIAGNOSTIC STEP & SAFE AUTO-STAGE
      - name: Check website files
        run: |
          echo "================================"
          echo "G6 AI PORTAL DEPLOYMENT CHECK"
          echo "================================"
          echo "Current directory: $(pwd)"
          echo ""
          echo "Repository file structure:"
          find . -maxdepth 3 -not -path '*/.*'
          echo ""

          # Search for index.html while avoiding hidden git files
          HTML_PATH=$(find . -not -path "*/.*" -name "index.html" | head -n 1)

          if [ -n "$HTML_PATH" ]; then
            echo "SUCCESS: index.html found at $HTML_PATH"
            # Extract folder location of index.html
            SRC_DIR=$(dirname "$HTML_PATH")
            echo "Source directory is: $SRC_DIR"
            
            # Create staging folder safely in /tmp to prevent "directory copying into itself"
            rm -rf /tmp/_site
            mkdir -p /tmp/_site
            
            # Copy files to temporary folder
            cp -r "$SRC_DIR"/* /tmp/_site/
            
            # Remove any nested _site folder if it was copied accidentally
            rm -rf /tmp/_site/_site
            
            # Bring staged directory back to workspace
            rm -rf _site
            mv /tmp/_site _site
            
            echo ""
            echo "Staged files ready for upload:"
            ls -la _site
          else
            echo "ERROR: index.html is missing from the repository."
            exit 1
          fi

      # UPLOAD WEBSITE
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # DEPLOY WEBSITE
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
